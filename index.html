<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MagusMe" />

    <!-- Primary Meta Tags -->
    <title>MagusMe — The Vault of Everything Occult</title>
    <meta name="description" content="Tarot, Runes, Astrology, Natal Charts, Spells, Manifestation, Kabbalah & more. 1,000+ verified spells from primary sources. 40+ divination & manifestation systems. AI that believes in magic." />
    <meta name="keywords" content="occult, tarot, runes, astrology, spells, magic, divination, manifestation, kabbalah, numerology, grimoire, witchcraft, wicca, hoodoo" />
    <link rel="canonical" href="https://magusme.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://magusme.com" />
    <meta property="og:title" content="MagusMe — The Vault of Everything Occult" />
    <meta property="og:description" content="Tarot, Runes, Astrology, Natal Charts, Spells, Manifestation & more. 1,000+ verified spells, 40+ divination systems. AI that believes in magic." />
    <meta property="og:image" content="https://magusme.com/og-image.png" />
    <meta property="og:site_name" content="MagusMe" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://magusme.com" />
    <meta name="twitter:title" content="MagusMe — The Vault of Everything Occult" />
    <meta name="twitter:description" content="Tarot, Runes, Astrology, Spells, Manifestation & more. 1,000+ verified spells, 40+ divination systems." />
    <meta name="twitter:image" content="https://magusme.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MagusMe",
      "alternateName": "MagusMe — The Vault of Everything Occult",
      "url": "https://magusme.com",
      "description": "Tarot, Runes, Astrology, Natal Charts, Spells, Manifestation, Kabbalah & more. 1,000+ verified spells from primary sources.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://magusme.com/learn?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fbfbfd; color: #1d1d1f; }
      html.dark, html.dark body { background: #09090b; color: #f4f4f5; }
    </style>
    <script>
      (function () {
        var t = localStorage.getItem("merlian-theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
