<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MagusMe" />
    <title>MagusMe</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fbfbfd; color: #1d1d1f; }
      html.dark, html.dark body { background: #09090b; color: #f4f4f5; }
    </style>
    <script>
      (function () {
        var t = localStorage.getItem("merlian-theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
