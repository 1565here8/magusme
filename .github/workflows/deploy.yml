name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Deploy to Main Server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avz --delete"
          SOURCE: "dist/"
          REMOTE_HOST: "178.105.155.211"
          REMOTE_USER: "root"
          TARGET: "/root/magusme/dist"

      - name: Copy to web root (Main)
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SOURCE: "dist/"
          REMOTE_HOST: "178.105.155.211"
          REMOTE_USER: "root"
          TARGET: "/var/www/magusme"

      - name: Restart Main Server
        uses: appleboy/ssh-action@v1
        with:
          host: "178.105.155.211"
          username: "root"
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/magusme
            rsync -a --delete dist/ /var/www/magusme/
            pm2 restart ecosystem.config.cjs --update-env
            echo "✅ Main server deployed at $(date)"

  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Deploy to Live Server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avz --delete"
          SOURCE: "dist/"
          REMOTE_HOST: "178.105.155.211"
          REMOTE_USER: "root"
          TARGET: "/root/magusme-live/dist"

      - name: Copy to web root (Live)
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SOURCE: "dist/"
          REMOTE_HOST: "178.105.155.211"
          REMOTE_USER: "root"
          TARGET: "/var/www/magusme"

      - name: Restart Live Server
        uses: appleboy/ssh-action@v1
        with:
          host: "178.105.155.211"
          username: "root"
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/magusme-live
            rsync -a --delete dist/ /var/www/magusme/
            pm2 restart ecosystem.config.cjs --update-env
            echo "✅ Live server deployed at $(date)"
